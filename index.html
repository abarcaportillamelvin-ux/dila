<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feliz Cumpleaños 🎂</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ─── FOTO DE FONDO ──────────────────────────────────────────
       Reemplaza  fondo.jpg  con el nombre de tu imagen.
       La imagen debe estar en la misma carpeta que index.html.
    ──────────────────────────────────────────────────────────── */
    .bg {
      position: fixed;
      inset: 0;
      background-image: url('fondo.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
    }

    /* Capa oscura encima de la foto para que el texto se lea bien */
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(10, 5, 30, 0.55);
    }

    /* ─── Globos ─────────────────────────────────────────────── */
    .balloon {
      position: fixed;
      bottom: -120px;
      font-size: 2.4rem;
      z-index: 1;
      pointer-events: none;
      animation: floatUp linear infinite;
      user-select: none;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0) translateX(0px);    opacity: 0; }
      5%   { opacity: 1; }
      50%  { transform: translateY(-52vh) translateX(18px); }
      75%  { transform: translateY(-78vh) translateX(-12px); }
      95%  { opacity: 0.7; }
      100% { transform: translateY(-115vh) translateX(8px); opacity: 0; }
    }

    /* ─── Página ─────────────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 900px;
      padding: 3rem 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
    }

    /* ─── Header ─────────────────────────────────────────────── */
    header { text-align: center; }

    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: normal;
      color: #fff;
      text-shadow: 0 2px 12px rgba(0,0,0,0.7);
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1rem;
      color: rgba(255,255,255,0.7);
      font-style: italic;
      text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    }

    /* ─── Layout central ─────────────────────────────────────── */
    .main-layout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      flex-wrap: wrap;
    }

    /* ─── Número 16 ──────────────────────────────────────────── */
    .number-16 {
      font-size: clamp(7rem, 18vw, 11rem);
      font-weight: bold;
      color: #fff;
      line-height: 1;
      user-select: none;
      text-shadow:
        0 0 30px rgba(167, 139, 250, 0.8),
        0 4px 20px rgba(0,0,0,0.6);
    }

    /* ─── Botones ────────────────────────────────────────────── */
    .btn-col {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn {
      padding: 0.7rem 1.6rem;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 8px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(6px);
      color: #fff;
      font-family: 'Georgia', serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      min-width: 145px;
      text-align: center;
    }

    .btn:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.7);
    }

    /* ─── Footer ─────────────────────────────────────────────── */
    footer {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
      text-align: center;
      padding-bottom: 1rem;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    /* ─── Modales ────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 3, 15, 0.82);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: #110a2e;
      border: 1px solid rgba(167, 139, 250, 0.25);
      border-radius: 14px;
      padding: 2rem;
      max-width: 640px;
      width: 100%;
      max-height: 82vh;
      overflow-y: auto;
      position: relative;
      transform: translateY(16px);
      transition: transform 0.25s;
    }

    .modal-overlay.active .modal { transform: translateY(0); }

    .modal-close {
      position: absolute;
      top: 1rem; right: 1.2rem;
      background: none; border: none;
      color: #6b7280; font-size: 1.3rem; cursor: pointer;
    }
    .modal-close:hover { color: #c4b5fd; }

    .modal h2 {
      font-size: 1.3rem;
      font-weight: normal;
      color: #a78bfa;
      margin-bottom: 1.2rem;
    }

    /* ─── Fotos ──────────────────────────────────────────────── */
    .photos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.8rem;
    }

    .photo-card {
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(167,139,250,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-card img { width:100%; height:100%; object-fit:cover; display:block; }
    .photo-placeholder { text-align:center; color:#4b5563; font-size:0.8rem; padding:0.8rem; }

    /* ─── Carta ──────────────────────────────────────────────── */
    .letter-body {
      line-height: 2;
      color: #ddd6fe;
      font-size: 0.97rem;
      white-space: pre-line;
    }
    .letter-signature {
      margin-top: 1.5rem;
      text-align: right;
      color: #7c3aed;
      font-style: italic;
    }

    /* ─── Razones ────────────────────────────────────────────── */
    .reasons-list { list-style:none; display:flex; flex-direction:column; gap:0.7rem; }
    .reasons-list li {
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(167,139,250,0.1);
      color: #c4b5fd;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .reasons-list li::before { content:'♡ '; color:#7c3aed; }

    /* ─── Historia ───────────────────────────────────────────── */
    .timeline { display:flex; flex-direction:column; gap:1.4rem; }
    .tl-date  { font-size:0.78rem; color:#4b5563; letter-spacing:1px; margin-bottom:0.2rem; }
    .tl-title { font-size:1rem; color:#a78bfa; margin-bottom:0.2rem; }
    .tl-desc  { font-size:0.9rem; color:#6b7280; line-height:1.6; }

    /* ─── Scrollbar ──────────────────────────────────────────── */
    .modal::-webkit-scrollbar { width:4px; }
    .modal::-webkit-scrollbar-thumb { background:rgba(167,139,250,0.3); border-radius:2px; }

    /* ─── Responsive ─────────────────────────────────────────── */
    @media (max-width: 580px) {
      .main-layout { gap: 2rem; }
      .number-16 { font-size: 6rem; }
    }
  </style>
</head>
<body>

<!-- Fondo: reemplaza fondo.jpg con tu imagen -->
<div class="bg"></div>

<!-- Los globos se generan aquí con JS -->

<div class="page">

  <header>
    <h1 id="titulo">Feliz Cumpleaños, Mi Amor</h1>
    <p>Hoy celebro todo lo que eres.</p>
  </header>

  <div class="main-layout">

    <div class="btn-col">
      <button class="btn" onclick="openModal('modal-fotos')">Fotos</button>
      <button class="btn" onclick="openModal('modal-carta')">Carta para ti</button>
    </div>

    <div class="number-16">16</div>

    <div class="btn-col">
      <button class="btn" onclick="openModal('modal-razones')">Te amo porque…</button>
      <button class="btn" onclick="openModal('modal-historia')">Nuestra historia</button>
    </div>

  </div>

  <footer>hecho con amor, solo para ti.</footer>

</div>


<!-- MODAL: FOTOS -->
<div class="modal-overlay" id="modal-fotos">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('modal-fotos')">✕</button>

    <div class="photos-grid">
      <div class="photo-card">
        <img src="foto1.jpeg" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"/>
        <div class="photo-placeholder" style="display:none">foto1.jpg</div>
      </div>
      <div class="photo-card">
        <img src="foto2.jpeg" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"/>
        <div class="photo-placeholder" style="display:none">foto2.jpg</div>
      </div>
      <div class="photo-card">
        <img src="foto3.jpeg" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"/>
        <div class="photo-placeholder" style="display:none">foto3.jpg</div>
      </div>
      <div class="photo-card">
        <img src="foto4.jpeg" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"/>
        <div class="photo-placeholder" style="display:none">foto4.jpg</div>
      </div>
      <div class="photo-card">
        <img src="foto5.jpeg" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"/>
        <div class="photo-placeholder" style="display:none">foto5.jpg</div>
      </div>
      <div class="photo-card">
        <img src="foto6.jpeg" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"/>
        <div class="photo-placeholder" style="display:none">foto6.jpg</div>
      </div>
    </div>
  </div>
</div>


<!-- MODAL: CARTA -->
<div class="modal-overlay" id="modal-carta">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('modal-carta')">✕</button>
    <h2>Una carta para ti</h2>
    <div class="letter-body" id="carta-contenido"></div>
    <div class="letter-signature" id="carta-firma"></div>
  </div>
</div>


<!-- MODAL: RAZONES -->
<div class="modal-overlay" id="modal-razones">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('modal-razones')">✕</button>
    <h2>Te amo porque…</h2>
    <ul class="reasons-list" id="razones-list"></ul>
  </div>
</div>


<!-- MODAL: HISTORIA -->
<div class="modal-overlay" id="modal-historia">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('modal-historia')">✕</button>
    <h2>Nuestra historia</h2>
    <div class="timeline" id="historia-timeline"></div>
  </div>
</div>


<script>

const cartaFirma = "— [Melvin, tu papoiii]"; // ← tu nombre

const razones = [
  "Porque tu sonrisa ilumina mis días más difíciles.",
  "Porque eres la persona más genuina que he conocido.",
  "Porque contigo el tiempo siempre vuela.",
  "Porque tu risa es completamente contagiosa.",
  "Porque siempre sabes qué decir cuando más te necesito.",
  "Porque me haces querer ser mejor persona.",
];

const historia = [
  {
    fecha: "09 / 03 / 2026",
    titulo: "El día que te conocí",
    desc: "Mi amor nos conocimos de una manera un poco extraña, los dos veniamos de una ruptura amorosa, pero juntos supimos salir adelante, nos dimos consejos hasta que el maravilloso lunes nos dimos un poquito y lo siguiente fue puro cine"
  },
  {
    fecha: "04 / 06 / 2026",
    titulo: "Nuestra primera salida",
    desc: "El famoso dia de turru mi amor, este dia fue fabuloso porque empezamos a tener mas confianza, pasaron muchas cosas entre ellas, besos e incluso un chisme con zaid, esta salida siempre la llevare en el corazon<3"
  },
  {
    fecha: "05 / 08 / 2026",
    titulo: "Ya novios",
    desc: "Tú sabes que yo prepare este dia como nunca, prepare el ramo 2 meses antes y le empece a decir a los chiquillos tambien, ese dia recuerdo estar muy nervioso y sobre todo con mucho miedo de que el regalo no te gustara, al final me dijiste que si y hasta se te salieron las lagrimas, yo realmente estaba que lloraba tambien, afortunadamente somos una pareja super linda y espero que asi sea hasta el dia de nuestra muerte"
  },
  {
    fecha: "hoy",
    titulo: "tus 16 años",
    desc: "hoy el 4 de octubre mi amor le dieron a tus papis la maravillosa noticia de que naciste super bien, aunque mas despues han habido complicaciones en tu vida mi amor hoy cumples 16 añitos, espero que sea un día lleno de mucha felicidad y sobre todo amor por parte de tus seres queridos (Tu mami no), te amo mucho mi amor espero que sea tu primer cumpleaños estando junto a mi mi vida"
  },
];

/* ──────────────────────────────────────────────
   No edites debajo de aquí
────────────────────────────────────────────── */

// Inyectar textos
document.getElementById('titulo').textContent = `Feliz Cumpleaños, ${nombreNovia}`;
document.getElementById('carta-contenido').textContent = cartaTexto;
document.getElementById('carta-firma').textContent = cartaFirma;

const razonesEl = document.getElementById('razones-list');
razones.forEach(r => {
  const li = document.createElement('li');
  li.textContent = r;
  razonesEl.appendChild(li);
});

const timelineEl = document.getElementById('historia-timeline');
historia.forEach(ev => {
  const div = document.createElement('div');
  div.className = 'tl-item';
  div.innerHTML = `
    <div class="tl-date">${ev.fecha}</div>
    <div class="tl-title">${ev.titulo}</div>
    <div class="tl-desc">${ev.desc}</div>`;
  timelineEl.appendChild(div);
});

// Modales
function openModal(id) {
  document.getElementById(id).classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
  document.body.style.overflow = '';
}
document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) closeModal(o.id); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape')
    document.querySelectorAll('.modal-overlay.active').forEach(m => closeModal(m.id));
});

// ─── Globos ─────────────────────────────────────────────────
// Emojis de globos en distintos colores (Unicode)
const globos = ['🎈', '🎈', '🎈', '🎈', '🎀', '🎁'];

function crearGlobo() {
  const el = document.createElement('div');
  el.className = 'balloon';
  el.textContent = globos[Math.floor(Math.random() * globos.length)];

  // Posición horizontal aleatoria
  el.style.left = (Math.random() * 95) + 'vw';

  // Tamaño aleatorio para dar profundidad
  const size = 1.6 + Math.random() * 1.6; // entre 1.6 y 3.2 rem
  el.style.fontSize = size + 'rem';

  // Duración aleatoria del viaje
  const duration = 7 + Math.random() * 7; // entre 7 y 14 segundos
  el.style.animationDuration = duration + 's';

  // Pequeño retraso para que no salgan todos juntos
  el.style.animationDelay = '0s';

  document.body.appendChild(el);

  // Eliminar del DOM al terminar la animación
  setTimeout(() => el.remove(), duration * 1000);
}

// Lanzar un globo cada ~900ms
setInterval(crearGlobo, 900);

// Lanzar unos cuantos globos al inicio para que no empiece vacío
for (let i = 0; i < 6; i++) {
  setTimeout(crearGlobo, i * 250);
}
</script>
</body>
</html>
